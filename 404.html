<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 fill=%22%231D1D1B%22/%3E%3Ctext x=%2232%22 y=%2245%22 font-family=%22Georgia,serif%22 font-size=%2238%22 fill=%22%23F6F2EC%22 text-anchor=%22middle%22%3E%D0%9D%3C/text%3E%3C/svg%3E">
<title>404 — Персональный стилист | Надежда Родионова</title>
<meta name="robots" content="noindex">
<base href="/ma/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Manrope',Arial,sans-serif;background:#1d1d1b;color:#fff;overflow:hidden}
.bg{position:fixed;inset:0;background:url(img/404-photo.webp) center 30%/cover no-repeat;filter:grayscale(1);transform:scale(1.06);animation:zoom 9s ease-out forwards}
.bg::after{content:"";position:absolute;inset:0;background:rgba(20,20,20,.62)}
@keyframes zoom{to{transform:scale(1)}}
main{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
  animation:rise 1.1s cubic-bezier(.22,.8,.24,1) .15s both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(84px,12vw,140px);line-height:1;letter-spacing:.02em;margin-bottom:22px}
p{font-size:clamp(16px,1.6vw,19px);line-height:1.6;opacity:.92}
a{display:inline-block;margin-top:44px;padding:18px 46px;border-radius:10px;background:#9E7F64;color:#fff;text-decoration:none;font-weight:600;
  font-size:14px;letter-spacing:.12em;text-transform:uppercase;transition:background .3s,transform .3s,box-shadow .3s;box-shadow:0 14px 30px -14px rgba(0,0,0,.6)}
a:hover{background:#B39276;transform:translateY(-2px)}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main>
  <h1>404</h1>
  <p>Такой страницы не существует<br>Для продолжения работы вернитесь на главную</p>
  <a href="./">На главную</a>
</main>
</body>
</html>
